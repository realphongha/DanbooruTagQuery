[project]
name = "danbooru-deploy"
version = "0.1.0"
description = "DanbooruTagQuery ONNX deployment: predictor, preprocessing, and Gradio UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.18.0",
    "numpy>=1.20.0",
    "pillow>=10.0.0",
    "gradio>=5.0.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.28.0"]
hf = ["huggingface-hub>=0.20"]

[project.scripts]
danbooru-deploy = "danbooru_deploy.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["danbooru_deploy*"]
